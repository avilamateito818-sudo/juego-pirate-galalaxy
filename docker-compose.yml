services:
  postgres:
    image: postgres:16-alpine
    container_name: starcorsair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starcorsair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starcorsair_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-starcorsair}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - starcorsair_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starcorsair} -d ${POSTGRES_DB:-starcorsair}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  starcorsair_pgdata:
