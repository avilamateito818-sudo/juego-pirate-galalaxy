name: starcorsair-galaxy

services:
  postgres:
    image: postgres:16-alpine
    container_name: starcorsair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starcorsair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starcorsair_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-starcorsair}
    ports:
      - "${POSTGRES_PORT:-49543}:5432"
    volumes:
      - starcorsair_pgdata:/var/lib/postgresql/data
    networks:
      - starcorsair_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-starcorsair} -d ${POSTGRES_DB:-starcorsair}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: starcorsair-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SERVER_PORT: 49267
      DATABASE_URL: postgresql://${POSTGRES_USER:-starcorsair}:${POSTGRES_PASSWORD:-starcorsair_dev_password}@postgres:5432/${POSTGRES_DB:-starcorsair}?schema=public
      JWT_SECRET: ${JWT_SECRET:-starcorsair-isolated-secret-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:49100}
    ports:
      - "${SERVER_PORT:-49267}:49267"
    networks:
      - starcorsair_net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: starcorsair-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-49100}:80"
    networks:
      - starcorsair_net

networks:
  starcorsair_net:
    name: starcorsair_net
    driver: bridge

volumes:
  starcorsair_pgdata:
    name: starcorsair_pgdata
